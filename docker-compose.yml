services:
  web-app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: abeladdis/anote:1.0
    depends_on:
      db:
        condition: service_healthy  # Wait for DB to be fully ready
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./log_file_dir:/ANOTE/log_file_dir
      - ./uploaded_files:/ANOTE/uploaded_files
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes: 
  postgres_data: